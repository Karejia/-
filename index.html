<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#fffaf3">
<title>班級計分板</title>
<style>
:root{color-scheme:light;--ink:#183852;--muted:#62788b;--sky:#dff3ff;--sky-strong:#a9dffa;--coral:#ff7567;--coral-dark:#ed5b50;--paper:#fffdf9;--line:#dce8ef;--shadow:0 14px 36px #294a6314;--gold:#ffb438}
*{box-sizing:border-box}body{margin:0;min-height:100vh;color:var(--ink);background:radial-gradient(ellipse at 15% 0%,#e8f7ff 0,transparent 34%),radial-gradient(ellipse at 90% 8%,#fff0e7 0,transparent 32%),#fffaf3;font:16px/1.5 ui-rounded,"Arial Rounded MT Bold","Microsoft JhengHei",system-ui,sans-serif}button,input{font:inherit}button{cursor:pointer;color:inherit}.app{max-width:1240px;margin:auto;padding:32px clamp(18px,4vw,54px) 56px}.top{display:flex;align-items:center;justify-content:space-between;gap:22px;margin-bottom:34px}.brand{display:flex;align-items:center;gap:18px}.trophy{width:72px;height:72px;display:grid;place-items:center;border-radius:24px;background:linear-gradient(145deg,#ffe8b4,#fff4d7);font-size:42px;box-shadow:0 10px 24px #eaa53826}.brand h1{margin:0;font-size:clamp(27px,4vw,42px);line-height:1.1;letter-spacing:.02em}.brand p{margin:7px 0 0;color:var(--muted);font-size:16px}.actions{display:flex;align-items:center;gap:14px}.total{display:flex;align-items:center;gap:10px;padding:13px 20px;border:2px solid #a7d1e9;border-radius:999px;background:#f0faff;font-weight:750;white-space:nowrap}.total .people{font-size:23px}.total strong{font-size:30px;color:var(--coral-dark);font-variant-numeric:tabular-nums}.add{min-height:58px;border:0;border-radius:18px;padding:0 23px;background:linear-gradient(145deg,#ff8977,#f45f55);color:#fff;font-weight:800;font-size:18px;box-shadow:0 8px 0 #dc584d,0 14px 25px #f8716330;transition:transform .13s,box-shadow .13s}.add:hover{transform:translateY(-2px);box-shadow:0 10px 0 #dc584d,0 18px 26px #f8716330}.add:active{transform:translateY(5px);box-shadow:0 3px 0 #dc584d}.toolbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin:-12px 0 20px;color:var(--muted);font-size:14px}.haptic{display:flex;align-items:center;gap:8px;cursor:pointer}.haptic input{width:18px;height:18px;accent-color:#1789bf}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}.card{position:relative;isolation:isolate;overflow:hidden;min-height:430px;padding:22px 22px 24px;border:2px solid var(--line);border-radius:32px;background:linear-gradient(160deg,#fff 20%,#fffcf8);box-shadow:var(--shadow);text-align:center;transform-style:preserve-3d;transition:border-color .2s,box-shadow .2s,transform .2s}.card:hover{transform:translateY(-3px);box-shadow:0 19px 42px #294a6320}.card:before{content:"";position:absolute;z-index:-1;inset:0 0 auto;height:160px;background:radial-gradient(ellipse,#e1f5ff 0,transparent 72%)}.card:nth-child(3n+2):before{background:radial-gradient(ellipse,#ffebe7 0,transparent 72%)}.avatar{width:146px;height:146px;margin:0 auto 12px;border-radius:50%;display:grid;place-items:center;overflow:hidden;border:7px solid #e1f5ff;background:linear-gradient(145deg,#c8efff,#95d9fa);color:#246b91;font-size:48px;font-weight:850;box-shadow:0 6px 17px #54acd12c}.card:nth-child(3n+2) .avatar{border-color:#ffe1dc;background:linear-gradient(145deg,#ffddd7,#ffc2b6);color:#9b4d43}.avatar img{width:100%;height:100%;object-fit:cover}.name{display:flex;align-items:center;justify-content:center;gap:7px;min-height:42px;margin:4px 0 12px;font-size:27px;font-weight:850;letter-spacing:.03em}.mini{width:34px;height:34px;border:0;border-radius:10px;background:transparent;color:#7990a0;font-size:17px}.mini:hover{background:#edf7fb;color:var(--ink)}.score{position:relative;display:flex;align-items:baseline;justify-content:center;gap:9px;width:min(100%,282px);min-height:90px;margin:0 auto 20px;border-radius:25px;background:linear-gradient(135deg,#e2f6ff,#cceeff);font-size:68px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;letter-spacing:-.04em;transition:background .2s,color .2s}.score small{font-size:24px;letter-spacing:0}.score-buttons{display:flex;gap:13px}.score-btn{flex:1;min-height:72px;border:0;border-radius:20px;font-size:38px;font-weight:900;line-height:1;transition:transform .12s,filter .12s,opacity .12s}.score-btn:active{transform:translateY(4px) scale(.97)}.minus{background:linear-gradient(145deg,#d6f1ff,#aedff8);color:#1c4967;box-shadow:0 6px 0 #8dc7e6}.plus{background:linear-gradient(145deg,#ff9180,#fb6b5f);color:#fff;box-shadow:0 6px 0 #e15a50}.score-btn:disabled{cursor:not-allowed;opacity:.45;box-shadow:none}.card-tools{position:absolute;top:13px;right:13px;display:flex;gap:3px}.impact{animation:impact .52s cubic-bezier(.16,.88,.28,1.2)}.impact .score{animation:score-pop .58s cubic-bezier(.12,.9,.25,1.35);color:#e44e44;background:linear-gradient(135deg,#fff2d8,#ffd1c6);box-shadow:0 0 0 8px #ffc66a34,0 0 36px #ff8b4f80}.impact:after{content:"";pointer-events:none;position:absolute;left:50%;top:54%;width:160px;height:160px;border:3px solid #ff9a48;border-radius:50%;animation:ring .55s ease-out both;transform:translate(-50%,-50%);z-index:3}.spark{position:absolute;left:50%;top:55%;pointer-events:none;z-index:4;color:#ff9b36;font-size:24px;font-weight:900;animation:spark .56s ease-out both}.spark:nth-child(1){--x:-73px;--y:-58px}.spark:nth-child(2){--x:72px;--y:-62px}.spark:nth-child(3){--x:-82px;--y:8px}.spark:nth-child(4){--x:83px;--y:13px}.empty{grid-column:1/-1;padding:68px 22px;border:2px dashed #bfd6e3;border-radius:28px;text-align:center;background:#ffffffa8;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:23px;margin-bottom:8px}.empty .add{margin-top:16px}.snack{position:fixed;z-index:20;left:50%;bottom:22px;display:flex;align-items:center;gap:16px;transform:translate(-50%,20px);opacity:0;pointer-events:none;padding:12px 16px 12px 20px;border:1px solid #d6e4eb;border-radius:16px;background:#fff;box-shadow:0 12px 35px #1838522b;color:var(--ink);transition:.2s}.snack.show{transform:translate(-50%,0);opacity:1;pointer-events:auto}.snack button{border:0;background:none;color:#087aa9;font-weight:800}.dialog-backdrop{position:fixed;z-index:30;inset:0;display:none;place-items:center;padding:18px;background:#18385255;backdrop-filter:blur(5px)}.dialog-backdrop.open{display:grid}.dialog{width:min(100%,470px);padding:27px;border:1px solid #deebf2;border-radius:26px;background:var(--paper);box-shadow:0 28px 90px #17354b42}.dialog h2{margin:0 0 20px;font-size:25px}.field{display:block;margin:15px 0 8px;font-weight:750}.text-input{width:100%;min-height:50px;border:1.5px solid #cadde8;border-radius:13px;padding:10px 13px;background:#fff;color:var(--ink);outline:none}.text-input:focus{border-color:#49a5cf;box-shadow:0 0 0 3px #49a5cf25}.preview{width:74px;height:74px;overflow:hidden;margin:12px 0 0;border-radius:50%;display:grid;place-items:center;background:#dff3ff;color:#246b91;font-size:28px;font-weight:800}.preview img{width:100%;height:100%;object-fit:cover}.dialog-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:25px}.secondary,.save{min-height:46px;padding:0 18px;border-radius:13px;font-weight:800}.secondary{border:1px solid #c8dbe6;background:#fff}.save{border:0;background:var(--coral);color:#fff}.danger{margin-right:auto;color:#b74b46}.toast{position:fixed;z-index:40;inset:0;display:none;place-items:center;background:#18385266;padding:18px}.toast.show{display:grid}.toast-card{width:min(100%,440px);padding:22px;border-radius:20px;background:#fff;box-shadow:0 25px 70px #18385244}.toast-card h3{margin:0 0 8px}.toast-card p{color:var(--muted)}.toast-actions{display:flex;justify-content:flex-end;gap:10px;margin-top:20px}:focus-visible{outline:3px solid #2196c6;outline-offset:3px}
@keyframes impact{0%{transform:translate3d(0,0,0) scale(1)}18%{transform:translate3d(-3px,2px,16px) scale(1.015)}36%{transform:translate3d(3px,-2px,5px) scale(.99)}55%{transform:translate3d(-1px,1px,0) scale(1.005)}100%{transform:none}}@keyframes score-pop{0%{transform:scale(.82);filter:brightness(1)}35%{transform:scale(1.18);filter:brightness(1.12)}100%{transform:scale(1)}}@keyframes ring{0%{opacity:.9;transform:translate(-50%,-50%) scale(.45)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.6)}}@keyframes spark{0%{opacity:1;transform:translate(-50%,-50%) scale(.4)}100%{opacity:0;transform:translate(calc(-50% + var(--x)),calc(-50% + var(--y))) scale(1.2)}}
@media(max-width:760px){.app{padding-top:20px}.top{align-items:flex-start;flex-direction:column;margin-bottom:24px}.actions{width:100%;flex-wrap:wrap}.total{flex:1;justify-content:center}.add{flex:1}.toolbar{margin-top:0}.grid{grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:15px}.card{min-height:400px;padding-top:20px}.avatar{width:128px;height:128px}.score{min-height:78px;font-size:60px}.score-btn{min-height:65px}}@media(max-width:420px){.brand{gap:12px}.trophy{width:58px;height:58px;border-radius:18px;font-size:34px}.brand p{font-size:14px}.total{padding:11px 12px;font-size:14px}.total strong{font-size:25px}.add{min-height:52px;padding:0 14px;font-size:16px}.grid{grid-template-columns:1fr}.card{min-height:390px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{scroll-behavior:auto!important;animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}}
</style>
<style>
body{overflow-x:hidden}.app.milestone-shake-5{animation:screen-shake-5 .38s ease-out}.app.milestone-shake-10{animation:screen-shake-10 .68s cubic-bezier(.2,.8,.25,1)}
.celebration-layer{position:fixed;z-index:60;inset:0;overflow:hidden;pointer-events:none}.firework-burst{position:absolute;left:var(--x);top:var(--y);width:1px;height:1px}.firework-particle{position:absolute;left:0;top:0;width:9px;height:15px;border-radius:50%;background:hsl(var(--hue) 95% 58%);box-shadow:0 0 12px hsl(var(--hue) 95% 64% / .75);animation:firework-burst .95s cubic-bezier(.1,.65,.2,1) forwards}.confetti-particle{position:absolute;left:var(--x);top:-18px;width:9px;height:14px;border-radius:2px;background:hsl(var(--hue) 92% 58%);animation:confetti-fall 1.45s cubic-bezier(.15,.65,.3,1) forwards}.milestone-message{position:fixed;z-index:70;top:20px;left:50%;max-width:calc(100vw - 32px);padding:13px 22px;border:2px solid #ffcb6a;border-radius:999px;background:#fffdf5;color:#193d56;box-shadow:0 10px 36px #24465b30;font-size:18px;font-weight:900;text-align:center;white-space:nowrap;opacity:0;transform:translate(-50%,-14px);pointer-events:none;transition:opacity .18s,transform .18s}.milestone-message.show{opacity:1;transform:translate(-50%,0)}
@keyframes screen-shake-5{0%,100%{transform:translateX(0)}18%{transform:translateX(-7px) rotate(-.16deg)}36%{transform:translateX(7px) rotate(.16deg)}54%{transform:translateX(-4px)}72%{transform:translateX(3px)}}@keyframes screen-shake-10{0%,100%{transform:translate3d(0,0,0) scale(1)}12%{transform:translate3d(-11px,4px,0) rotate(-.3deg) scale(1.004)}25%{transform:translate3d(10px,-3px,0) rotate(.28deg) scale(1.003)}39%{transform:translate3d(-8px,3px,0) rotate(-.2deg)}53%{transform:translate3d(7px,-2px,0) rotate(.16deg)}68%{transform:translateX(-4px)}82%{transform:translateX(2px)}}@keyframes firework-burst{0%{opacity:1;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(0) scale(.35)}68%{opacity:1}100%{opacity:0;transform:translate(-50%,-50%) rotate(var(--angle)) translateY(var(--distance)) scale(.8)}}@keyframes confetti-fall{0%{opacity:0;transform:translateY(-2vh) rotate(0)}12%{opacity:1}100%{opacity:0;transform:translateY(112vh) rotate(var(--rotation))}}
@media(prefers-reduced-motion:reduce){.app.milestone-shake-5,.app.milestone-shake-10{animation:none!important}.firework-particle,.confetti-particle{display:none!important}.milestone-message{transition:none;transform:translate(-50%,0)}}
</style>
<style>
.app.milestone-shake-5{animation:screen-shake-5 .68s ease-out}.app.milestone-shake-10{animation:screen-shake-10 1s cubic-bezier(.2,.8,.25,1)}
.next-milestone{display:inline-block;margin:-9px auto 14px;padding:4px 11px;border:1px solid #d7e8ef;border-radius:999px;background:#f5fbff;color:#607c8d;font-size:12px;font-weight:750}.next-milestone.firework-target{border-color:#ffd59a;background:#fff8e8;color:#a75e12}
.milestone-message{top:20px;padding:16px 26px;font-size:21px;border-width:3px}.app.milestone-shake-5{animation-name:screen-shake-5}.app.milestone-shake-10{animation-name:screen-shake-10}
@keyframes screen-shake-5{0%,100%{transform:translateX(0)}14%{transform:translateX(-14px) rotate(-.28deg) scale(1.006)}29%{transform:translateX(13px) rotate(.26deg) scale(1.004)}46%{transform:translateX(-9px) rotate(-.18deg)}64%{transform:translateX(7px) rotate(.12deg)}82%{transform:translateX(-3px)}}
@keyframes screen-shake-10{0%,100%{transform:translate3d(0,0,0) scale(1)}10%{transform:translate3d(-23px,7px,0) rotate(-.55deg) scale(1.012)}22%{transform:translate3d(21px,-6px,0) rotate(.5deg) scale(1.01)}35%{transform:translate3d(-17px,5px,0) rotate(-.42deg) scale(1.008)}48%{transform:translate3d(14px,-4px,0) rotate(.34deg)}62%{transform:translate3d(-10px,3px,0) rotate(-.23deg)}76%{transform:translateX(6px)}88%{transform:translateX(-2px)}}
</style>
</head>
<body>
<main class="app" id="app">
  <header class="top">
    <div class="brand"><div class="trophy" aria-hidden="true">🏆</div><div><h1>班級計分板</h1><p>清楚記錄每一次進步</p></div></div>
    <div class="actions"><div class="total" aria-live="polite"><span class="people" aria-hidden="true">👥</span><span>全隊</span><strong id="total">0</strong><span>分</span></div><button class="add" id="add">＋ 新增玩家</button></div>
  </header>
  <div class="toolbar"><span id="count">名單保存在此裝置</span><label class="haptic"><input id="haptics" type="checkbox" checked> 加分時震動</label></div>
  <section class="grid" id="grid" aria-label="玩家名單"></section>
</main>
<div class="snack" id="snack" role="status"><span id="snackText"></span><button id="undo">復原</button></div>
<div class="dialog-backdrop" id="dialogBackdrop" role="presentation"><section class="dialog" role="dialog" aria-modal="true" aria-labelledby="dialogTitle"><h2 id="dialogTitle">新增玩家</h2><label class="field" for="playerName">玩家名稱</label><input class="text-input" id="playerName" maxlength="24" placeholder="輸入姓名" autocomplete="off"><label class="field" for="avatarFile">自訂頭像</label><input class="text-input" id="avatarFile" type="file" accept="image/*"><div class="preview" id="preview" aria-label="頭像預覽">?</div><div class="dialog-actions"><button class="secondary danger" id="remove" hidden>刪除玩家</button><button class="secondary" id="cancel">取消</button><button class="save" id="save">儲存</button></div></section></div>
<div class="toast" id="confirm"><section class="toast-card" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle"><h3 id="confirmTitle">刪除這位玩家？</h3><p>刪除後可在短時間內復原。</p><div class="toast-actions"><button class="secondary" id="keep">取消</button><button class="save" id="confirmRemove">刪除</button></div></section></div>
<div class="celebration-layer" id="celebrationLayer" aria-hidden="true"></div><div class="milestone-message" id="milestoneMessage" role="status" aria-live="polite"></div>
<script>
(()=>{
  const KEY='bright-scoreboard-v1';
  const sample=[{id:crypto.randomUUID(),name:'林小明',score:12,avatar:''},{id:crypto.randomUUID(),name:'陳怡君',score:8,avatar:''},{id:crypto.randomUUID(),name:'王大偉',score:12,avatar:''}];
  let people;try{people=JSON.parse(localStorage.getItem(KEY))||sample}catch{people=sample}
  let editing=null,avatarData='',undoAction=null,snackTimer,shakeTimer,celebrationTimer,messageTimer;
  const $=id=>document.getElementById(id),grid=$('grid');
  const persist=()=>{try{localStorage.setItem(KEY,JSON.stringify(people))}catch{$('count').textContent='儲存空間不足，請使用較小的頭像'}};
  const initials=name=>Array.from(name||'?').slice(-1)[0];
  function render(){grid.replaceChildren();$('total').textContent=people.reduce((sum,p)=>sum+p.score,0);$('count').textContent=people.length?`${people.length} 位玩家 · 名單保存在此裝置`:'名單保存在此裝置';if(!people.length){const e=document.createElement('div');e.className='empty';e.innerHTML='<strong>準備開始記分了嗎？</strong><span>新增玩家來建立你的第一份名單。</span><br><button class="add" id="emptyAdd">＋ 新增玩家</button>';grid.append(e);$('emptyAdd').onclick=()=>openDialog();return}
    for(const p of people){const card=document.createElement('article');card.className='card';card.dataset.id=p.id;const avatar=p.avatar?`<img alt="${escapeHtml(p.name)}的頭像" src="${p.avatar}">`:escapeHtml(initials(p.name)),nextMilestone=(Math.floor(p.score/5)+1)*5;card.innerHTML=`<div class="card-tools"><button class="mini edit" aria-label="編輯${escapeHtml(p.name)}">✎</button></div><div class="avatar">${avatar}</div><div class="name">${escapeHtml(p.name)}</div><div class="score" aria-live="polite"><span>${p.score}</span><small>分</small></div><div class="next-milestone ${nextMilestone%10===0?'firework-target':''}">下個里程碑：${nextMilestone} 分${nextMilestone%10===0?' · 煙火':' · 全頁震動'}</div><div class="score-buttons"><button class="score-btn minus" aria-label="扣除${escapeHtml(p.name)}一分" ${p.score===0?'disabled':''}>−1</button><button class="score-btn plus" aria-label="增加${escapeHtml(p.name)}一分">＋1</button></div>`;
      card.querySelector('.edit').onclick=()=>openDialog(p.id);card.querySelector('.minus').onclick=()=>change(p.id,-1);card.querySelector('.plus').onclick=()=>change(p.id,1,card);grid.append(card)}
  }
  function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
  function feedback(card){if($('haptics').checked&&'vibrate'in navigator)navigator.vibrate([45,24,65]);card.classList.remove('impact');void card.offsetWidth;card.classList.add('impact');for(let i=0;i<4;i++){const s=document.createElement('i');s.className='spark';s.setAttribute('aria-hidden','true');s.textContent='✦';card.append(s);setTimeout(()=>s.remove(),650)}setTimeout(()=>card.classList.remove('impact'),650)}
  function triggerMilestone(level,score){const app=$('app'),className=level===10?'milestone-shake-10':'milestone-shake-5';app.classList.remove('milestone-shake-5','milestone-shake-10');void app.offsetWidth;app.classList.add(className);clearTimeout(shakeTimer);shakeTimer=setTimeout(()=>app.classList.remove(className),level===10?1100:780);const message=$('milestoneMessage');message.textContent=level===10?`🎉 ${score} 分達成！禮炮與煙火！`:`✨ ${score} 分里程碑！`;message.classList.add('show');clearTimeout(messageTimer);messageTimer=setTimeout(()=>message.classList.remove('show'),4000);if(level!==10)return;const layer=$('celebrationLayer');layer.replaceChildren();clearTimeout(celebrationTimer);const colors=[8,42,185,318];for(let b=0;b<4;b++){const burst=document.createElement('div');burst.className='firework-burst';burst.style.setProperty('--x',`${16+b*23}%`);burst.style.setProperty('--y',`${24+(b%2)*20}%`);for(let i=0;i<18;i++){const particle=document.createElement('i');particle.className='firework-particle';particle.style.setProperty('--angle',`${i*20}deg`);particle.style.setProperty('--distance',`${54+Math.random()*78}px`);particle.style.setProperty('--hue',colors[(i+b)%colors.length]);particle.style.animationDelay=`${b*.11}s`;burst.append(particle)}layer.append(burst)}for(let i=0;i<54;i++){const confetti=document.createElement('i');confetti.className='confetti-particle';confetti.style.setProperty('--x',`${Math.random()*100}%`);confetti.style.setProperty('--hue',colors[i%colors.length]);confetti.style.setProperty('--rotation',`${240+Math.random()*900}deg`);confetti.style.animationDelay=`${Math.random()*.35}s`;layer.append(confetti)}celebrationTimer=setTimeout(()=>layer.replaceChildren(),2100)}
  function change(id,delta,card){const p=people.find(x=>x.id===id);if(!p||p.score+delta<0)return;const before=p.score;p.score+=delta;persist();render();if(delta>0){const active=grid.querySelector(`[data-id="${CSS.escape(id)}"]`);feedback(active);const crossedTen=Math.floor(p.score/10)>Math.floor(before/10),crossedFive=Math.floor(p.score/5)>Math.floor(before/5);if(crossedTen)triggerMilestone(10,p.score);else if(crossedFive)triggerMilestone(5,p.score)}showUndo(`${p.name} ${delta>0?'+1':'−1'} 分`,()=>{p.score=before;persist();render()})}
  function showUndo(message,undo){undoAction=undo;$('snackText').textContent=message;$('snack').classList.add('show');clearTimeout(snackTimer);snackTimer=setTimeout(()=>{$('snack').classList.remove('show');undoAction=null},5000)}
  $('undo').onclick=()=>{if(undoAction)undoAction();undoAction=null;$('snack').classList.remove('show')};
  function openDialog(id=null){editing=id;avatarData=id?people.find(p=>p.id===id)?.avatar||'':'';$('dialogTitle').textContent=id?'編輯玩家':'新增玩家';$('playerName').value=id?people.find(p=>p.id===id).name:'';$('avatarFile').value='';$('remove').hidden=!id;setPreview(avatarData,$('playerName').value);$('dialogBackdrop').classList.add('open');setTimeout(()=>$('playerName').focus(),40)}
  function setPreview(src,name){$('preview').innerHTML=src?`<img alt="頭像預覽" src="${src}">`:escapeHtml(initials(name))}
  $('add').onclick=()=>openDialog();$('cancel').onclick=closeDialog;function closeDialog(){$('dialogBackdrop').classList.remove('open')}
  $('playerName').oninput=()=>{if(!$('avatarFile').files[0])setPreview(avatarData,$('playerName').value)};
  $('avatarFile').onchange=async()=>{const file=$('avatarFile').files[0];if(!file)return;if(!file.type.startsWith('image/')){alert('請選擇圖片檔案。');return}try{const bitmap=await createImageBitmap(file),scale=Math.min(1,320/Math.max(bitmap.width,bitmap.height)),canvas=document.createElement('canvas');canvas.width=Math.round(bitmap.width*scale);canvas.height=Math.round(bitmap.height*scale);canvas.getContext('2d').drawImage(bitmap,0,0,canvas.width,canvas.height);avatarData=canvas.toDataURL('image/jpeg',.8);bitmap.close();setPreview(avatarData,$('playerName').value)}catch{alert('無法讀取這張圖片，請換一張再試。')}};
  $('save').onclick=()=>{const name=$('playerName').value.trim();if(!name){$('playerName').focus();return}if(editing){const p=people.find(x=>x.id===editing);if(p){const old={...p};p.name=name;p.avatar=avatarData;persist();render();showUndo('已更新玩家資料',()=>{Object.assign(p,old);persist();render()})}}else{const p={id:crypto.randomUUID(),name,score:0,avatar:avatarData};people.push(p);persist();render();showUndo(`已新增 ${name}`,()=>{people=people.filter(x=>x.id!==p.id);persist();render()})}closeDialog()};
  let removalId=null;$('remove').onclick=()=>{removalId=editing;$('confirm').classList.add('show')};$('keep').onclick=()=>$('confirm').classList.remove('show');$('confirmRemove').onclick=()=>{const idx=people.findIndex(p=>p.id===removalId);if(idx<0)return;const [removed]=people.splice(idx,1);persist();render();$('confirm').classList.remove('show');closeDialog();showUndo(`已刪除 ${removed.name}`,()=>{people.splice(Math.min(idx,people.length),0,removed);persist();render()})};
  $('dialogBackdrop').onclick=e=>{if(e.target===$('dialogBackdrop'))closeDialog()};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();$('confirm').classList.remove('show')}});render();
})();
</script>
</body>
</html>
